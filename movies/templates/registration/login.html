<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
</head>
<body>
    <h1>Log in</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Log in</button>
    </form>
    <p>
        Don't have an account?
        <a href="{% url 'movies:signup' %}">Sign up</a>
    </p>
    <a href="{% url 'movies:movie_list' %}">Back to movies</a>
</body>
</html>
